<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content ="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Calculus Test Generator</title>
    <style>
        :root{
            --sky:#d8f0ff;
            --pale:#f2faff;
            --blue:#2189c5;
            --deep:#194c6c;
            --text:#253f51;
            --muted:#638093;
            --line:#d538f3;
            --white:#fff;
        }
        *{
            box-sizing: border-box;
        }
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            line-height:1.6;
            background:#f5fbff;
            color:var(--text);
        }
        button,input,select{font:inherit;}
        button{
            cursor:pointer;
        }
        .topbar{
            background:#e1f3ff;
            border-bottom:1px solid #c9e6f7;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px max(25px, calc((100vw - 1180px) / 2));
            gap:20px
        }
        .logo{
            display:flex;
            align-items:center;
            gap:15px;
            color:var(--deep)
        }
        .logo-mark{
            display:grid;
            place-items:center;
            width:49px;
            height:49px;
            border-radius:14px;
            background:#b9e4fc;
            font-size:33px;
            font-weight:bold
        }
        .logo strong{
            display:block;
            font-size:21px;
            line-height:1.25
        }
        .logo small{
            display:block;
            font-size:12px;
            letter-spacing: .04em;
            color:var(--muted);
            margin-top:4px;
        }
        .header-tag{
            background:white;
            border:1px solid #c9e5f5;
            border-radius:25px;
            padding:8px 15px;
            font-size:12px;
            color:var(--deep);
            font-weight:bold
        }
        main{
            max-width:1220px;
            margin:auto;
            padding:30px 22px
        }
        .welcome {
             display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
            padding: 37px 42px;
            background:linear-gradient(115deg,#d33dff,#eff9ff);
            border:1px solid #c9e6f6;
            border-radius:20px;
            margin-bottom:27px;
        }
        .welcome h1 {
            font-size:clamp(27px,3.5vw,42px);
            line-height:1.2;
            color:#174e72;
            margin:11px 0
        }
        .welcome p {
            max-width:690px;
            margin:0;
            color:#52748b
        }
        .eyebrow {
            font-size:11px;
            letter-spacing:.16em;
            font-weight:bold;
            color:#277fb4
        }
        .hero-icon{
            font-size:31px;
            white-space:nowrap;
            color:#388bbb;
            background:#ffffff99;
            border:1px solid #c5e5f6;
            padding:20px 25px;
            border-radius:18px;
        }
        .tabs {
            display:flex;
            flex-wrap:wrap;
            gap:12px;
            border-bottom:1px solid #d1e6f2;
            padding:0 4px 13px;
            margin-bottom:22px
        }
        .tab{
            border:1px solid transparent;
            border-radius:10px;
            padding:12px 20px;
            background:transparent;
            color:#56788c;
            font-weight:bold;
        }
        .tab:hover {
            background: #e6f5ff
        }
        .tab.active {
            background:#d7efff;
            color:#125c89;
            border-color:#b8def3
        }
        .tab-panel{
            display:none;
        }
        .tab-panel.active {
            display:block;
        }
        .workspace {
            display:grid;
            grid-template-columns:370px minmax(0,1fr);
            gap:22px
        }
        .card{
            background:white;
            border:1px solid var(--line);
            border-radius:18px;
            padding:29px;
            box-shadow:0 5px 24px #155f870a
        }
        .section-heading{
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:22px;
        }
        .step {
            display:grid;
            place-items:center;
            min-width:43px;
            height:43px;
            background:#d9f1ff;
            color:#2378a8;
            border-radius:12px;
            font-weight:bold
        }
        .section-heading h2 {
            font-size:22px;
            color:var(--deep);
            line-height:1.3;
            margin:0
        }
        .section-heading p{
            font-size:13px;
            color:var(--muted);
            margin:4px 0 0
        }
        label {
            display:block;
            font-size:13px;
            font-weight:bold;
            color:#345a70;
            margin:17px 0  7px
        }
        select,input:not([type=checkbox]){
            display:block;
            width:100%;
            min-height:46px;
            border:1px solid #b9d9eb;
            background:#fbfeff;
            border-radius:9px;
            padding:10px 13px;
            color:#234d65
        }
        select:focus,input:focus,button:focus-visible{
            outline:3px solid #a4dcff;
            outline-offset:2px
        }
        .two-fields{
            display: grid;
            grid-template-columns:1fr 1fr;
            gap:15px
        }
        .check{
            display:flex;
            align-items:center;
            gap:11px;
            margin:22px 0
        }
        .check input {
            width:17px;
            height:17px;
            accent-color:#278fc9
        }
        .primary,.outline{
            border-radius:10px;
            padding:12px 19px;
            font-size:14px;
            font-weight:bold;
            border:1px solid #2488c0
        }
        .primary{
            background: #278fc9;
            color:white
        }
        .primary:hover{
            background:#176d9f
        }
        .outline{
            background:#eaf7ff;
            color:#176b99;
            border-color:#b9dff3
        }
        .outline:hover{
            background:#d7f0ff;
        }
        .settings .primary{
            width:100%;
            margin-top:2px;
        }
        .status{
            font-size:12px;
            color:#5e8195;
            margin:13px 0 0
        }
    </style>
</head>
<body>

</body>
</html>
